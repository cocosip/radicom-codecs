[workspace]
resolver = "3"
members = [
    "crates/radicom-codecs",
    "crates/radicom-codecs-rle",
    "crates/radicom-codecs-jpeg",
    "crates/radicom-codecs-jpeg-ls",
    "crates/radicom-codecs-jpeg2000",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/cocosip/radicom-codecs"

[workspace.dependencies]
radicom = { path = "../radicom/crates/radicom", version = "=0.2.0" }
