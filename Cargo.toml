[workspace]
resolver = "3"
members = [
    "crates/radicom-codecs",
    "crates/radicom-codecs-rle",
    "crates/radicom-codecs-jpeg",
    "crates/radicom-codecs-jpeg-ls",
    "crates/radicom-codecs-jpeg2000",
    "crates/radicom-codecs-tool",
]

[workspace.package]
# Single source of truth for the workspace version: members inherit it, and the
# internal pins under [workspace.dependencies] repeat it because a packaged path
# dependency must carry a literal version. A release bump edits those literals
# together in this file; cargo fails the build when they disagree.
version = "0.1.2"
edition = "2021"
rust-version = "1.89"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/cocosip/radicom-codecs"

[workspace.dependencies]
# Upstream core library: the released crate from crates.io. Do not point this at
# a local radicom checkout, so CI and consumers build exactly what users get.
radicom = "0.1.2"

# Internal crates: one path + version pair for the whole graph. Cargo rejects a
# mismatch between these pins and the members' versions, so a stale bump fails
# every build instead of failing halfway through a publish.
radicom-codecs = { path = "crates/radicom-codecs", version = "0.1.2" }
radicom-codecs-jpeg = { path = "crates/radicom-codecs-jpeg", version = "0.1.2" }
radicom-codecs-jpeg-ls = { path = "crates/radicom-codecs-jpeg-ls", version = "0.1.2" }
radicom-codecs-jpeg2000 = { path = "crates/radicom-codecs-jpeg2000", version = "0.1.2" }
radicom-codecs-rle = { path = "crates/radicom-codecs-rle", version = "0.1.2" }
