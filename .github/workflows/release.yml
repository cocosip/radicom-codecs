name: Release

# Publishing is tag-driven only: pushing a v* tag is the single trigger.
# master/main never publishes (see ci.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Serialize tag releases: two tags must never race each other on crates.io.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify-tag:
    name: verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # The tag and every publishable crate must agree, and the publishable set
      # must match the list publish actually pushes, so a crate added to the
      # workspace can never be silently left unpublished.
      - name: Tag and crate set must match the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo metadata --format-version 1 --no-deps > meta.json
          python3 - "$tag" <<'PY'
          import json, sys

          tag = sys.argv[1]
          packages = json.load(open("meta.json"))["packages"]
          publishable = {p["name"]: p["version"] for p in packages if p.get("publish") is None}
          expected = {
              "radicom-codecs",
              "radicom-codecs-jpeg",
              "radicom-codecs-jpeg-ls",
              "radicom-codecs-jpeg2000",
              "radicom-codecs-rle",
              "radicom-codecs-tool",
          }

          problems = []
          if set(publishable) != expected:
              problems.append(
                  f"publishable crates {sorted(publishable)} != {sorted(expected)}; "
                  "update the publish list in release.yml"
              )
          for name, version in sorted(publishable.items()):
              print(f"{name}={version}")
              if version != tag:
                  problems.append(f"{name} is {version}, but the tag is v{tag}")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)
          print(f"tag v{tag} matches all {len(publishable)} publishable crates")
          PY

  test:
    name: checks before release
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Every gate ci.yml enforces, plus the default-feature build that users
      # get from `cargo add`: a tag must not publish what CI would reject.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # `--list` only: before the first release the dependents' own path deps
      # are not on crates.io yet, so `cargo package` cannot resolve them; the
      # ordered publish below covers their full build. This still proves the
      # metadata and the shipped README.
      - name: Publishable metadata and shipped files
        run: |
          for pkg in radicom-codecs-rle radicom-codecs-jpeg radicom-codecs-jpeg-ls radicom-codecs-jpeg2000 radicom-codecs radicom-codecs-tool; do
            echo "::group::$pkg"
            files=$(cargo package -p "$pkg" --list | tr -d '\r')
            printf '%s\n' "$files"
            if ! printf '%s\n' "$files" | grep -qx "README.md"; then
              echo "::error::$pkg does not package README.md"
              exit 1
            fi
            echo "::endgroup::"
          done

  msrv:
    name: msrv (1.89)
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-features

  publish:
    name: publish to crates.io
    needs: [test, msrv]
    runs-on: ubuntu-latest
    env:
      # verify-tag already proved that this tag equals the crate version.
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Dependency order: a crate can only be published after everything it
      # depends on exists on crates.io.
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          # A failed tag release is re-run from the same tag, so versions that
          # already reached crates.io must be skipped rather than retried:
          # cargo publish refuses to overwrite an existing version.
          published() {
            curl -fsS -H "User-Agent: radicom-codecs-release-ci (https://github.com/cocosip/radicom-codecs)" \
              "https://crates.io/api/v1/crates/$1/$2" >/dev/null
          }

          # The crates.io index needs a moment to expose a freshly published
          # crate; retry a few times before giving up on an index miss.
          publish() {
            local pkg="$1"
            for attempt in 1 2 3 4 5 6; do
              echo "::group::cargo publish $pkg (attempt $attempt)"
              if cargo publish -p "$pkg"; then
                echo "::endgroup::"
                echo "$pkg published"
                return 0
              fi
              echo "::endgroup::"
              echo "$pkg not publishable yet, retrying in 30s"
              sleep 30
            done
            echo "::error::failed to publish $pkg"
            return 1
          }

          for pkg in radicom-codecs-rle radicom-codecs-jpeg radicom-codecs-jpeg-ls radicom-codecs-jpeg2000 radicom-codecs radicom-codecs-tool; do
            if published "$pkg" "$version"; then
              echo "$pkg $version is already on crates.io, skipping"
            else
              publish "$pkg"
            fi
          done

  github-release:
    name: github release (previous version → this version)
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release notes describe the two versions the tag spans: the previous
      # release tag and this tag, with the commits and compare link between them.
      - name: Generate release notes for the previous and current version
        run: |
          set -euo pipefail
          curr_tag="${GITHUB_REF_NAME}"
          prev_tag="$(git describe --tags --abbrev=0 "${curr_tag}^" 2>/dev/null || true)"
          if [ -n "$prev_tag" ]; then
            prev_label="${prev_tag}"
            range="${prev_tag}..HEAD"
            compare="**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${curr_tag}"
          else
            # First tagged release: there is no previous version to compare with.
            prev_label="(initial release)"
            range="$(git rev-list --max-parents=0 HEAD)..HEAD"
            compare=""
          fi
          {
            echo "## Versions"
            echo ""
            echo "| Previous | Current |"
            echo "| --- | --- |"
            echo "| ${prev_label} | ${curr_tag} |"
            echo ""
            echo "## What's Changed"
            echo ""
            git log "${range}" --pretty=tformat:"- %s" --no-merges
            echo ""
            if [ -n "$compare" ]; then
              echo "$compare"
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
